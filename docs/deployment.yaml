apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-saas-api
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-saas-api
  template:
    metadata:
      labels:
        app: billing-saas-api
    spec:
      containers:
      - name: api
        image: registry.digitalocean.com/your-registry/billing-saas:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: url
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: billing-saas-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: billing-saas-api